name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.5.0
        with:
          python-version: "3.11"

      - name: Install lint tools
        run: pip install ruff black

      - name: Run Ruff (linter)
        run: ruff check pipeline/detect.py scripts/gen_test_video.py scripts/validate_events.py --select E,F,W --ignore E501


  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.5.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        run: pytest tests/ -v --tb=short --junitxml=reports/test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: reports/test-results.xml

  detect-smoke:
    name: Detection Smoke Test (MOG2 + YOLO stub)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.5.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate synthetic test video
        run: python scripts/gen_test_video.py --frames 60 --output /tmp/test_cam.mp4

      - name: Run detector (MOG2 mode)
        run: |
          python pipeline/detect.py \
            --video /tmp/test_cam.mp4 \
            --store STORE_TEST_001 \
            --camera CAM_FLOOR_01 \
            --layout data/store_layout.json \
            --output /tmp/events_test.jsonl \
            --backend mog2

      - name: Validate output schema
        run: python scripts/validate_events.py --file /tmp/events_test.jsonl

      - name: Upload detection output
        uses: actions/upload-artifact@v4
        with:
          name: smoke-events
          path: /tmp/events_test.jsonl

  api-test:
    name: API Integration Tests
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.5.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start FastAPI server
        run: |
          python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          sleep 3

      - name: Health check
        run: curl -f http://localhost:8000/health

      - name: Run API integration tests
        run: pytest tests/ -v --tb=short

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test, api-test]

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Build Docker image
        run: docker compose build

      - name: Run container smoke test
        run: |
          docker compose up -d
          sleep 5
          curl -f http://localhost:8000/health
          docker compose down
